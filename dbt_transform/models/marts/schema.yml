version: 2

models:
  - name: mart_route_performance
    description: "Daily route performance KPIs — primary Gold table"
    columns:
      - name: id
        tests: [unique, not_null]
      - name: route_id
        tests: [not_null]
      - name: event_date
        tests: [not_null]
      - name: on_time_rate_pct
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
      - name: performance_grade
        tests:
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'F']
      - name: total_events
        tests:
          - dbt_utils.accepted_range:
              min_value: 0

  - name: mart_delay_summary
    description: "Network-wide daily delay summary"
    columns:
      - name: event_date
        tests: [unique, not_null]
      - name: network_on_time_rate_pct
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100