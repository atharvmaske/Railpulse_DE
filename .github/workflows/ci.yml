
name: RailPulse DE — CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff==0.3.5
      - name: Run ruff
        run: ruff check ingestion/ scripts/ serving/

  test-ingestion:
    name: Test — Ingestion Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run ingestion tests
        run: pytest ingestion/tests/ -v --tb=short
        env:
          GTFS_RT_URL: http://mock-gtfs-rt
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

  test-dbt:
    name: Test — dbt Models
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: railpulse
          POSTGRES_USER: railpulse
          POSTGRES_PASSWORD: railpulse_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dbt
        run: pip install dbt-core==1.7.9 dbt-postgres==1.7.9

      - name: Generate temporary dbt profile
        working-directory: dbt_transform
        env:
          DBT_PASSWORD: railpulse_secret
        run: |
          cat > profiles.yml <<EOF
          railpulse:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                port: 5432
                user: railpulse
                password: "${DBT_PASSWORD}"
                dbname: railpulse
                schema: gold
                threads: 4
                connect_timeout: 10
          EOF

      - name: Run init SQL
        run: |
          PGPASSWORD=railpulse_secret psql \
            -h localhost -U railpulse -d railpulse \
            -f serving/postgres/init.sql

      - name: dbt deps
        working-directory: dbt_transform
        run: dbt deps --profiles-dir .

      - name: dbt seed
        working-directory: dbt_transform
        run: dbt seed --profiles-dir . --target dev

      - name: dbt run
        working-directory: dbt_transform
        run: dbt run --profiles-dir . --target dev

      - name: dbt test
        working-directory: dbt_transform
        run: dbt test --profiles-dir . --target dev --exclude source:railpulse_raw.service_alerts

  validate-compose:
    name: Validate docker-compose.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML
        run: docker compose config --quiet

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test-ingestion, test-dbt, validate-compose]
    if: always()
    steps:
      - name: All checks passed
        run: |
          echo " RailPulse DE CI All done"
